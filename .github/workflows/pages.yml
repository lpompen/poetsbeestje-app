# Zet Poetsbeestje automatisch op GitHub Pages bij elke push naar main.
# Eenmalig aanzetten: repo > Settings > Pages > Source: "GitHub Actions".
name: Publiceer op GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Alleen de app-bestanden klaarzetten
        run: |
          mkdir -p _site/data
          cp index.html app.js styles.css sw.js manifest.webmanifest icon.svg _site/
          cp data/items.js _site/data/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
